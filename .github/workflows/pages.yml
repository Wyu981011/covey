name: Pages

# 把 docs/demo/（零依赖的单文件演示页）发布到 https://ericxk.github.io/covey/ 。
# 开通前（仓库设置里 Pages 的 Source 还没选 GitHub Actions）不会跑红：push 触发要等仓库变量
# PAGES_ENABLED=true 才发布；手动触发（workflow_dispatch）总是发布，开通后可以先手动跑一次。
# 开通：Settings -> Pages -> Source 选 GitHub Actions；再在 Settings -> Variables 加 PAGES_ENABLED=true。

on:
  push:
    branches: [main]
    paths:
      - "docs/demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 上传和部署分两个 job：deploy 等 build 结束、产物落定后才开始（deploy-pages 推荐的用法；
  # 同一个 job 里传完马上部署，deploy-pages 曾找不到刚传的 github-pages 产物）。
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
