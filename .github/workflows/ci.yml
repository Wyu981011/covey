name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push that comes while the run of the one before is still going cancels that run: only the latest commit is
# tested, and a cancelled run sends no failure mail.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The machines Covey runs on and is developed on are on Asia/Shanghai time; the tests see the same days.
      TZ: Asia/Shanghai
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pyflakes
        run: python -m pip install pyflakes
      - name: Static checks
        run: |
          python -m pyflakes covey bin tests scripts
          bash -n install scripts/*.sh web/scripts/*.sh web/deploy/selfhost/build.sh
      - name: Privacy check (generic rules)
        run: python scripts/privacy_check.py
      - name: Documentation links
        run: python scripts/check_doc_links.py
      - name: Test ledger
        # test_map.py keeps no ledger under $HOME or the temp dirs, and runner.temp is under $HOME.
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /var/lib/covey-ci
          echo "BRIDGE_TEST_LEDGER=/var/lib/covey-ci/test-ledger.jsonl" >> "$GITHUB_ENV"
      - name: Tests
        run: |
          status=0
          python -B scripts/test_map.py run --full --why ci || status=$?
          # 0 passed; 2 refused (a stale map) or another error: no retry.
          [ "$status" -eq 1 ] || exit "$status"
          # Tests that start processes or wait on the clock now and then fail on a 2-core runner: a few failed
          # modules run once more, and only a failure there fails the job (the first failures stay in the log above).
          # No retry when the ledger does not name every failure or a name is not a test module's.
          modules=$(python scripts/ci_retry_modules.py "$BRIDGE_TEST_LEDGER") || exit 1
          echo "::warning::retrying the failed test modules once: $modules"
          python -B scripts/test_map.py run --why ci-retry $modules

  web:
    # The web workbench (web/): lint, its unit tests and the self-hosted build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        # package-lock.json records every package at registry.npmmirror.com, which a runner outside China reaches slowly
        # or not at all: install from the public registry instead (the @lark-apaas/* packages are on it too).
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=registry.npmmirror.com
      - name: Lint
        run: npm run lint
      - name: Tests
        # Every test:* script of package.json (test:selfhost-tls and test:selfhost-api build the server themselves).
        run: |
          for name in $(node -p "Object.keys(require('./package.json').scripts).filter(k => k.startsWith('test:')).join(' ')"); do
            echo "::group::npm run $name"
            npm run "$name"
            echo "::endgroup::"
          done
      - name: Build (self-hosted)
        run: npm run build:selfhost
